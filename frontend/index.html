<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nancy English Center - Management System</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>
    <div id="app-root">

        <section id="login-page">

            <div class="login-wrapper">

                <aside class="login-aside">
                    <img class="logo-nancy" src="../frontend/assets/logos/Logo.jpg" alt="">
                    <div class="login-content">
                        <div class="login-containt">
                            <form class="form-login" id="login-form" action="">
                                <div>
                                    <input type="text" name="email" id="enter-email" placeholder="Your email...">
                                </div>
                                <div class="password-area">
                                    <input type="password" name="password" id="enter-password"
                                        placeholder="Your password...">
                                </div>
                                <div>
                                    <button id="enter-submit">Login</button>
                                </div>
                                <div class="lost-passwork">
                                    <a class="link-a" href="lost-passwork">
                                        Lost Login ?
                                    </a>
                                </div>
                            </form>
                            <div class="line">
                            </div>
                            <div class="login-with-google">
                                <div id="g_id_onload"
                                    data-client_id="221954001036-kcggfq8096s34oi1ockt7pqd3mbkd82d.apps.googleusercontent.com"
                                    data-callback="handleCredentialResponse" data-auto_prompt="false">
                                </div>
                                <div class="g_id_signin" data-type="standard" data-size="large" data-theme="outline"
                                    data-text="signin_with" data-shape="rectangular" data-logo_alignment="left">
                                </div>
                            </div>
                        </div>
                    </div>
                </aside>
                <div class="contact">
                    <address>
                        <p class="contact_detail">
                            <i class="fa-solid fa-envelope"></i>
                            <a href="mailto:thaituan@example.com">Contact Us</a>
                        </p>
                        <p>|</p>
                        <p class="contact_detail">
                            <i class="fa-solid fa-location-dot"></i>
                            <a href="tel:...">Dĩ An, Bình Dương, Vietnam</a>
                        </p>
                        <p>|</p>
                        <p class="contact_detail">
                            <i class="fa-solid fa-phone"></i>
                            <a href="tel:+84123456789">0123 456 789</a>
                        </p>
                    </address>
                </div>

                <aside class="intro-aside">

                </aside>

            </div>

        </section>

    </div>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="js/login.js"></script>
</body>

</html>
