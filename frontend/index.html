<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nancy English Center - Management System</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <div id="app-root">

        <section id="login-page">

            <div class="login-wrapper">

                <aside class="login-aside">
                    <div class="login-content">
                        <a href=""><img src="../frontend/assets/logos/" alt=""></a>
                        <form class="form-login" action="">
                            <div>
                                <input type="text" name="email" id="enter-email" placeholder="Your email...">
                            </div>
                            <div>
                                <input type="text" name="password" id="enter-password" placeholder="Your password...">
                            </div>
                            <div>
                                <button id="enter-submit">Login</button>
                            </div>
                            <div class="lost-passwork">
                                <a href="lost-passwork">
                                    <p>Lost Login ! Let enter here.</p>
                                </a>
                            </div>
                        </form>

                        <div class="line">

                        </div>
                        <div class="login-with-google">
                            <a href="">
                                <img class="logo-gg" src="./assets/logos/google-ar21.svg" alt="">
                                <p>Google</p>
                            </a>
                        </div>
                    </div>
                </aside>

                <aside class="intro-aside">

                </aside>

            </div>

        </section>

    </div>
</body>

</html>
