<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nancy English Center - Management System</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>
    <div id="app-root">

        <section id="login-page">

            <div class="login-wrapper">

                <aside class="login-aside">
                    <img class="logo-nancy" src="../frontend/assets/logos/Logo.jpg" alt="">
                    <div class="login-content">
                        <form class="form-login" id="login-form" action="">
                            <div>
                                <input type="text" name="email" id="enter-email" placeholder="Your email...">
                            </div>
                            <div>
                                <input type="text" name="password" id="enter-password" placeholder="Your password...">
                            </div>
                            <div>
                                <button id="enter-submit">Login</button>
                            </div>
                            <div class="lost-passwork">
                                <a class="link-a" href="lost-passwork">
                                    Lost Login ?
                                </a>
                            </div>
                        </form>

                        <div class="line">

                        </div>
                        <div class="login-with-google">
                            <a href="">
                                <img class="logo-gg" src="./assets/logos/google-ar21.svg" alt="">
                            </a>
                            <p><a class="link-a" href="#">Login by Google</a></p>
                        </div>
                    </div>
                </aside>
                <div class="contact">
                    <address>
                        <p class="contact_detail">
                            <i class="fa-solid fa-envelope"></i>
                            <a href="mailto:thaituan@example.com">Contact Us</a>
                        </p>
                        <p>|</p>
                        <p class="contact_detail">
                            <i class="fa-solid fa-location-dot"></i>
                            <a href="tel:...">Dĩ An, Bình Dương, Vietnam</a>
                        </p>
                        <p>|</p>
                        <p class="contact_detail">
                            <i class="fa-solid fa-phone"></i>
                            <a href="tel:+84123456789">0123 456 789</a>
                        </p>
                    </address>
                </div>

                <aside class="intro-aside">

                </aside>

            </div>

        </section>

    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', function (event) {
            // Ngăn chặn trình duyệt reload lại trang web khi bấm nút Submit
            event.preventDefault();

            // 1. Lấy dữ liệu thật từ các ô Input theo đúng ID của bạn
            const emailInput = document.getElementById('enter-email').value;
            const passwordInput = document.getElementById('enter-password').value;

            console.log("Sending request to Java Server...");

            // 2. Gửi tín hiệu (Fetch) tới tổng đài Java Backend đang mở ở cổng 8080
            fetch(`http://localhost:8080/api/login?email=${emailInput}&password=${passwordInput}`)
                .then(response => response.text())
                .then(data => {
                    // Kiểm tra câu trả lời từ Java đổ ra
                    if (data === 'SUCCESS') {
                        alert('🎉 LOGIN SUCCESSFUL! Welcome to Nancy Management System.');
                    } else {
                        alert('❌ LOGIN FAILED! Wrong email or password.');
                    }
                })
                .catch(error => {
                    // Trường hợp quên chưa bật Server Java ngầm ở VS Code
                    alert('❌ Cannot connect to Backend Server! Please make sure Java Server is running.');
                    console.error('Error:', error);
                });
        });
    </script>
</body>

</html>
